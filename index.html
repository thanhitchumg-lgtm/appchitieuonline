<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Cấu hình App toàn màn hình trên iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Chi Tiêu">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382625.png">
    
    <title>Quản Lý Chi Tiêu</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --primary: #007AFF;
            --danger: #FF3B30;
            --text-main: #000000;
            --text-sub: #8E8E93;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            user-select: none;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 20px 0 16px 0;
        }
        .total-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 16px;
        }
        .total-label {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }
        .total-amount {
            font-size: 34px;
            font-weight: 800;
            color: var(--danger);
        }
        .form-card, .monthly-card, .expense-list, .backup-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E5E5EA;
            border-radius: 10px;
            font-size: 16px;
            background: #FAFAFC;
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--primary);
        }
        .date-select-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        button.add-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        button.add-btn:active {
            opacity: 0.8;
        }
        .list-header {
            font-size: 18px;
            font-weight: 600;
            margin: 8px 0 10px 0;
        }
        /* Danh sách thống kê theo tháng */
        .monthly-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #E5E5EA;
            font-size: 15px;
        }
        .monthly-item:last-child {
            border-bottom: none;
        }
        .monthly-month {
            font-weight: 600;
        }
        .monthly-amount {
            font-weight: 700;
            color: var(--danger);
        }
        /* Danh sách giao dịch */
        .expense-list {
            padding: 0;
            overflow: hidden;
        }
        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #E5E5EA;
        }
        .expense-item:last-child {
            border-bottom: none;
        }
        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .item-name {
            font-size: 16px;
            font-weight: 600;
        }
        .item-meta {
            font-size: 13px;
            color: var(--text-sub);
        }
        .item-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .item-amount {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }
        .delete-btn {
            background: #FFE5E5;
            color: var(--danger);
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .empty-text {
            text-align: center;
            padding: 20px;
            color: var(--text-sub);
            font-size: 15px;
        }
        .backup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-secondary {
            background: #E5E5EA;
            color: var(--text-main);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        /* Chân trang bản quyền */
        .footer-copyright {
            text-align: center;
            font-style: italic;
            color: var(--text-sub);
            font-size: 13px;
            margin: 30px 0 20px 0;
        }
    </style>
</head>
<body>

    <h1>Quản Lý Chi Tiêu</h1>

    <!-- Tổng chi tiêu chung -->
    <div class="total-card">
        <div class="total-label">Tổng chi tiêu toàn bộ</div>
        <div class="total-amount" id="totalAmount">0 ₫</div>
    </div>

    <!-- Form thêm khoản chi -->
    <div class="form-card">
        <div class="input-group">
            <label>Chọn Ngày / Tháng / Năm</label>
            <div class="date-select-row">
                <select id="selectDay"></select>
                <select id="selectMonth"></select>
                <select id="selectYear"></select>
            </div>
        </div>

        <div class="input-group">
            <label>Tên khoản chi</label>
            <input type="text" id="expenseName" placeholder="VD: Ăn trưa, Đổ xăng...">
        </div>

        <div class="input-group">
            <label>Số tiền (VNĐ)</label>
            <input type="number" id="expenseAmount" placeholder="VD: 50000" inputmode="numeric">
        </div>

        <div class="input-group">
            <label>Danh mục</label>
            <select id="expenseCategory">
                <option value="🍜 Ăn uống">🍜 Ăn uống</option>
                <option value="🛵 Di chuyển">🛵 Di chuyển</option>
                <option value="🛍️ Mua sắm">🛍️ Mua sắm</option>
                <option value="🧾 Hóa đơn">🧾 Hóa đơn</option>
                <option value="🎮 Giải trí">🎮 Giải trí</option>
                <option value="📦 Khác">📦 Khác</option>
            </select>
        </div>

        <button class="add-btn" onclick="addExpense()">+ Thêm Khoản Chi</button>
    </div>

    <!-- Thống kê tổng theo tháng -->
    <div class="list-header">Thống kê theo tháng</div>
    <div class="monthly-card" id="monthlySummaryContainer"></div>

    <!-- Danh sách lịch sử giao dịch -->
    <div class="list-header">Lịch sử giao dịch</div>
    <div class="expense-list" id="expenseList"></div>

    <!-- Sao lưu & Khôi phục dữ liệu -->
    <div class="list-header" style="margin-top: 20px;">Sao lưu & Khôi phục</div>
    <div class="backup-card">
        <div class="backup-grid">
            <button class="btn-secondary" onclick="backupData()">⬇️ Sao lưu file</button>
            <button class="btn-secondary" onclick="document.getElementById('restoreInput').click()">⬆️ Khôi phục</button>
        </div>
        <input type="file" id="restoreInput" accept=".json" style="display:none" onchange="restoreData(event)">
    </div>

    <!-- Bản quyền chân trang -->
    <div class="footer-copyright">
        © 2026 - Nguyễn Hữu Thành
    </div>

    <script>
        function initDateSelectors() {
            const daySelect = document.getElementById('selectDay');
            const monthSelect = document.getElementById('selectMonth');
            const yearSelect = document.getElementById('selectYear');

            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth() + 1;
            const currentYear = today.getFullYear();

            for (let d = 1; d <= 31; d++) {
                let opt = document.createElement('option');
                opt.value = d;
                opt.text = d;
                if (d === currentDay) opt.selected = true;
                daySelect.appendChild(opt);
            }

            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = m;
                opt.text = `Tháng ${m}`;
                if (m === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }

            for (let y = 2026; y <= 2050; y++) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.text = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }
        }

        let expenses = JSON.parse(localStorage.getItem('my_expenses_v2')) || [];

        function formatVND(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        function renderApp() {
            renderSummaryAndList();
        }

        function renderSummaryAndList() {
            const listEl = document.getElementById('expenseList');
            const totalEl = document.getElementById('totalAmount');
            const monthlyEl = document.getElementById('monthlySummaryContainer');

            // Tổng toàn bộ
            const total = expenses.reduce((sum, item) => sum + item.amount, 0);
            totalEl.innerText = formatVND(total);

            if (expenses.length === 0) {
                monthlyEl.innerHTML = '<div class="empty-text">Chưa có dữ liệu thống kê</div>';
                listEl.innerHTML = '<div class="empty-text">Chưa có khoản chi tiêu nào</div>';
                return;
            }

            // Thống kê theo tháng (Key dạng "MM/YYYY")
            let monthlyMap = {};
            expenses.forEach(item => {
                let parts = item.date.split('/'); // dd/mm/yyyy
                let mKey = `${parts[1]}/${parts[2]}`;
                if (!monthlyMap[mKey]) monthlyMap[mKey] = 0;
                monthlyMap[mKey] += item.amount;
            });

            // Hiển thị danh sách tổng hợp theo tháng
            monthlyEl.innerHTML = Object.keys(monthlyMap).map(mKey => `
                <div class="monthly-item">
                    <span class="monthly-month">Tháng ${mKey}</span>
                    <span class="monthly-amount">${formatVND(monthlyMap[mKey])}</span>
                </div>
            `).join('');

            // Hiển thị lịch sử giao dịch
            listEl.innerHTML = expenses.map((item, index) => `
                <div class="expense-item">
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-meta">${item.category} •${item.date}</span>
                    </div>
                    <div class="item-right">
                        <span class="item-amount">-${formatVND(item.amount
